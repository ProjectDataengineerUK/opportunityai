name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGION: us-central1
  AR_HOST: us-central1-docker.pkg.dev
  AR_REPO: opportunityai

jobs:
  # ── Job 1: Testes — roda em todo PR e push ────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        working-directory: backend
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short --cov=agents --cov-report=term-missing

  # ── Job 2: Deploy — só na main, após testes passarem ─────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Build & push backend
        id: backend
        run: |
          IMAGE=${{ env.AR_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/backend
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest ./backend
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          echo "image=${IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push frontend
        id: frontend
        run: |
          IMAGE=${{ env.AR_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest ./frontend
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          echo "image=${IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_PROJECT_ID }}-tf-state-opportunityai" \
            -backend-config="prefix=terraform/state"

      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="backend_image=${{ steps.backend.outputs.image }}" \
            -var="frontend_image=${{ steps.frontend.outputs.image }}"

      - name: Deploy summary
        run: |
          echo "### Deploy concluído :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** \`${{ steps.backend.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** \`${{ steps.frontend.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
